groups:
  - name: ghost-alerts
    rules:

      # =====================================
      # Ghost Application Down Alert
      # =====================================
      - alert: GhostDown
        expr: up{job="ghost"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ghost application is down"
          description: "Ghost service has been unreachable for more than 1 minute."

      # =====================================
      # High CPU Usage Alert
      # =====================================
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[2m]) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 2 minutes."

      # =====================================
      # High Memory Usage Alert
      # =====================================
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 500MB for more than 2 minutes."