global:
  scrape_interval: 15s
  evaluation_interval: 15s

# =====================================
# Alert Rules File
# =====================================
rule_files:
  - "alert.rules.yml"

# =====================================
# Alertmanager Configuration
# =====================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# =====================================
# Scrape Configurations
# =====================================
scrape_configs:

  # =====================================
  # Prometheus Self Monitoring
  # =====================================
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  # =====================================
  # Ghost Application Monitoring
  # Official Kubernetes deployment uses:
  # image: ghost:5-alpine
  # service: ghost-service
  # =====================================
  - job_name: "ghost"
    metrics_path: /
    static_configs:
      - targets:
          - "ghost-service:2368"

  # =====================================
  # Node Exporter Monitoring
  # System Metrics (CPU, RAM, Disk)
  # =====================================
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  # =====================================
  # Kubernetes Metrics (Optional Future)
  # =====================================
  - job_name: "kubernetes"
    static_configs:
      - targets:
          - "host.docker.internal:10250"