name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - main
      - develop

jobs:

  # ===================================
  # BUILD STAGE
  # ===================================
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        run: npm install -g pnpm

      - name: Verify Environment
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ghost Production
        run: pnpm build:production

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ghost/core
            apps/admin/dist

  # ===================================
  # TEST STAGE
  # ===================================
  test:
    name: Test Stage
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Validation
        run: echo "Unit tests skipped for DevSecOps project demo"

  # ===================================
  # SECURITY SCAN + DOCKER BUILD
  # ===================================
  security-scan:
    name: Security Scan
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ===================================
      # BUILD IMAGE USING Dockerfile.production
      # ===================================
      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/ghost-app:latest \
          -f Dockerfile.production .

      # ===================================
      # TRIVY SECURITY SCAN
      # ===================================
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/ghost-app:latest'
          format: 'table'
          exit-code: '0'

      # ===================================
      # PUSH IMAGE TO DOCKER HUB
      # ===================================
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ghost-app:latest

  # ===================================
  # DEPLOY TO STAGING
  # ===================================
  deploy-staging:
    name: Deploy to Staging
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying Ghost to staging environment..."
          echo "Staging deployment successful"

  # ===================================
  # DEPLOY TO PRODUCTION
  # ===================================
  deploy-production:
    name: Deploy to Production
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://ghost.yourdomain.com

    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying Ghost to production..."
          echo "Production deployment successful"

      - name: Smoke Test
        run: |
          echo "Running smoke tests..."
          echo "Application verified successfully"

  # ===================================
  # SLACK NOTIFICATION SUCCESS
  # ===================================
  notify-success:
    name: Slack Success Notification
    needs: deploy-production
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Slack Notification (Success)
        run: |
          curl -X POST -H "Content-type: application/json" \
          --data '{"text":"✅ DevSecOps Pipeline SUCCESS - Ghost deployed successfully"}' \
          ${{ secrets.SLACK_WEBHOOK }}

  # ===================================
  # SLACK NOTIFICATION FAILURE
  # ===================================
  notify-failure:
    name: Slack Failure Notification
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Slack Notification (Failure)
        run: |
          curl -X POST -H "Content-type: application/json" \
          --data '{"text":"❌ DevSecOps Pipeline FAILED - Please check GitHub Actions logs"}' \
          ${{ secrets.SLACK_WEBHOOK }}
