name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ===================================
  # BUILD STAGE
  # ===================================
  build:
    name: Build Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Match the version Ghost requested in your logs
          node-version: '22.13.1'

      - name: Install PNPM via NPM
        # Standard setup-node cache often fails if PNPM isn't in PATH yet.
        # This global install ensures the executable is found immediately.
        run: npm install -g pnpm@10.33.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ghost Production
        # FIX: Increased memory to 4GB (4096) to prevent Exit Code 130 crash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist
            apps
            ghost

  # ===================================
  # TEST STAGE
  # ===================================
  test:
    name: Test Stage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Install PNPM
        run: npm install -g pnpm@10.33.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Validation
        run: echo "Unit tests skipped for DevSecOps project demo"

  # ===================================
  # SECURITY SCAN + DOCKER BUILD
  # ===================================
  security-scan:
    name: Security Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Install PNPM
        run: npm install -g pnpm@10.33.0

      # SNYK SCAN (Vulnerability scan for dependencies)
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/ghost-app:latest \
          -f Dockerfile.production .

      # TRIVY SCAN (Vulnerability scan for the Docker image)
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/ghost-app:latest'
          format: 'table'
          exit-code: '0'

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ghost-app:latest

  # ===================================
  # DEPLOYMENT
  # ===================================
  deploy-staging:
    name: Deploy to Staging
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy
        run: echo "Deploying Ghost to staging..."

  deploy-production:
    name: Deploy to Production
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Deploy
        run: echo "Deploying Ghost to production..."

  # ===================================
  # NOTIFICATIONS
  # ===================================
  notify-success:
    name: Slack Success Notification
    needs: [deploy-production, deploy-staging]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Notify
        run: |
          curl -X POST -H "Content-type: application/json" \
          --data '{"text":"✅ DevSecOps Pipeline SUCCESS - Ghost deployed"}' \
          ${{ secrets.SLACK_WEBHOOK }}

  notify-failure:
    name: Slack Failure Notification
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Notify
        run: |
          curl -X POST -H "Content-type: application/json" \
          --data '{"text":"❌ DevSecOps Pipeline FAILED - Check GitHub logs"}' \
          ${{ secrets.SLACK_WEBHOOK }}