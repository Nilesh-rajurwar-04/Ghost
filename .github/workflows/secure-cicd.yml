name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - main
      - develop

jobs:

  # ===================================
  # BUILD STAGE
  # ===================================
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PNPM Globally
        run: npm install -g pnpm

      - name: Verify Environment
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ghost Production
        run: pnpm build:production

  # ===================================
  # TEST STAGE
  # ===================================
  test:
    name: Test Stage
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PNPM Globally
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Stage Validation
        run: echo "Unit tests skipped for Secure CI/CD project demo"

  # ===================================
  # SECURITY SCAN STAGE
  # ===================================
  security-scan:
    name: Security Scan
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PNPM Globally
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # -------------------------------
      # SNYK SECURITY SCAN
      # -------------------------------
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high --detection-depth=4

      # -------------------------------
      # DOCKER IMAGE BUILD
      # -------------------------------
      - name: Build Docker Image
        run: docker build -t ghost:${{ github.sha }} .

      # -------------------------------
      # TRIVY VULNERABILITY SCAN
      # -------------------------------
      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghost:${{ github.sha }}
          format: table

  # ===================================
  # DOCKER BUILD + PUSH
  # ===================================
  docker-build:
    name: Docker Build and Push
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ghost:latest
            ${{ secrets.DOCKER_USERNAME }}/ghost:${{ github.sha }}

  # ===================================
  # DEPLOY STAGING
  # ===================================
  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy to Staging
        run: echo "Deploying to staging..."

  # ===================================
  # DEPLOY PRODUCTION
  # ===================================
  deploy-production:
    name: Deploy to Production
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Production
        run: echo "Deploying to production..."
